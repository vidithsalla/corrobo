name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only checks out and tests; it never writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corrobo
          POSTGRES_PASSWORD: corrobo
          POSTGRES_DB: corrobo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CORROBO_TEST_DATABASE_URL: postgres://corrobo:corrobo@localhost:5432/corrobo_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (including live Postgres coverage)
        run: npm test

      - name: Build
        run: npm run build

      - name: DBOS workflow example (real SIGKILL mid-step; exits non-zero unless naive=2 and corrobo=1 credits)
        working-directory: examples/dbos-workflow
        env:
          DATABASE_URL: ${{ env.CORROBO_TEST_DATABASE_URL }}
        run: npm ci && npm run typecheck && npm run demo

      - name: Timeout-after-write demo (exits non-zero if its proof fails)
        run: npm run demo

      - name: Conformance harness example (exits non-zero unless it passes the good contract and fails the bad one)
        run: npm run conformance

      - name: Generic REST example smoke test
        run: npm run example:rest

      - name: Stripe deterministic example smoke test
        run: npm run example:stripe
