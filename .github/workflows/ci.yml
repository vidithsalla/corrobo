name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corrobo
          POSTGRES_PASSWORD: corrobo
          POSTGRES_DB: corrobo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CORROBO_TEST_DATABASE_URL: postgres://corrobo:corrobo@localhost:5432/corrobo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (including live Postgres coverage)
        run: npm test

      - name: Build
        run: npm run build

      - name: Generic REST example smoke test
        run: npm run example:rest

      - name: Stripe deterministic example smoke test
        run: npm run example:stripe
